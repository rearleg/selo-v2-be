# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.selo-ai.my;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;  # 'listen ... http2' 경고 제거
    server_name api.selo-ai.my;

    # Cloudflare Origin Cert
    ssl_certificate     /etc/ssl/cf-origin/api.pem;
    ssl_certificate_key /etc/ssl/cf-origin/api.key;

    # 업로드 제한 (필요시 조정)
    client_max_body_size 20m;

    # 보안/성능 헤더(필요에 따라 조정)
    # add_header X-Content-Type-Options nosniff always;
    # add_header X-Frame-Options DENY always;
    # add_header Referrer-Policy same-origin always;
    # add_header Cross-Origin-Opener-Policy same-origin always;

    # gzip (정적 리소스 압축)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 정적/미디어
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
    }

    # 백엔드 API (현재 전체를 web으로 프록시)
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    # ⚠️ AI 경로 매핑은 'ai' 서비스 추가할 때 넣자 (지금 넣으면 upstream 해석 실패 위험)
    # location /ai/ {
    #   proxy_pass http://ai:9000;  # 나중에 compose에 ai 서비스 생긴 후 활성화
    #   ... 동일한 proxy_set_header ...
    # }
}