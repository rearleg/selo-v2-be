services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"                        # root로 시작(권한 꼬임 방지)
    environment:
      - DJANGO_PROJECT=config
      - SQLITE_PATH=/data/db/db.sqlite3
    env_file:
      - app.env
    volumes:
      - selo_data:/data                # <- 하나만
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  with urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=5) as r:\n    sys.exit(0 if r.status==200 else 1)\nexcept Exception as e:\n  sys.exit(1)\nPY"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      web:
        condition: service_healthy     # web이 Healthy 된 뒤 시작
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/static:ro
      - media_data:/media:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/ssl/cf-origin:ro
    restart: unless-stopped

volumes:
  selo_data:
  static_data:
  media_data: